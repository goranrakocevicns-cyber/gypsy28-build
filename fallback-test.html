<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gypsy 28 — Fallback test</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#f5f1e8;color:#16212a}h1{margin-bottom:6px}.ok{padding:12px;background:#e5f5e8;border:1px solid #79a983;margin:20px 0}.bad{padding:12px;background:#fde8e8;border:1px solid #b66;margin:20px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.gallery img{width:100%;height:220px;object-fit:contain;background:#fff;border:1px solid #ccc}.meta{color:#59636a}</style></head><body><h1>Gypsy 28 — izolovani fallback test</h1><p class="meta">Ova stranica namerno NE kontaktira Supabase. Čita isključivo GitHub backup: <code>content/posts/index.json</code> i rezervne fotografije iz <code>backup-images/</code>.</p><div id="status">Učitavanje GitHub backupa…</div><main id="out"></main><script>(async()=>{const s=document.getElementById('status'),o=document.getElementById('out');try{const r=await fetch('/gypsy28-build/content/posts/index.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const posts=await r.json();if(!Array.isArray(posts)||!posts.length)throw Error('Backup nema objava');const p=posts.find(x=>x.slug==='2026-09-18-od-ideje-do-katamarana')||posts[0];const imgs=[p.image,...(p.gallery||[])].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);s.className='ok';s.innerHTML='<b>FALLBACK RADI.</b> GitHub backup je učitan bez Supabase-a. Objave: '+posts.length+'; fotografije ove objave: '+imgs.length+'.';o.innerHTML='<h2>'+p.title+'</h2><p>'+((p.body||p.summary||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])))+'</p><div class="gallery">'+imgs.map(x=>'<img src="'+x+'" alt="backup fotografija">').join('')+'</div>';if(imgs.length!==3){s.className='bad';s.innerHTML='<b>FALLBACK JE UČITAN, ali broj fotografija nije očekivan.</b> Nađeno: '+imgs.length+'.';}}catch(e){s.className='bad';s.textContent='FALLBACK TEST NIJE PROŠAO: '+e.message;console.error(e)}})();</script></body></html>
