<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gypsy 28 — Коментари</title><link rel="stylesheet" href="/style.css"><style>main{max-width:900px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.controls,.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.controls button,.action{border:0;padding:10px 14px;cursor:pointer;font:inherit}.primary{background:#16212a;color:#fff}.secondary{background:#eee}.danger{background:#8b2727;color:#fff}.tabs{margin:24px 0}.tabs button.active{background:#16212a;color:#fff}.thread{border:1px solid #cfcfcf;border-radius:10px;margin:18px 0;padding:14px;background:#fafafa}.thread-head{display:flex;gap:14px;align-items:center;padding-bottom:12px;border-bottom:1px solid #ddd}.thread-head img{width:150px;height:105px;object-fit:contain;background:#fff;border:1px solid #ddd}.thread-head b{display:block}.root-thread{padding:8px 0;border-bottom:2px solid #e3e3e3}.root-thread:last-child{border-bottom:0}.item{padding:14px 10px;border-top:1px solid #e1e1e1}.root-thread>.item:first-child{border-top:0}.children{margin-left:26px;border-left:3px solid #d7d7d7;padding-left:10px}.children .children{margin-left:22px;border-left-color:#e5e5e5}.meta{font-size:13px;color:#667;margin-bottom:8px}.body{white-space:pre-wrap;font-size:16px}.actions{margin-top:12px}.reply{display:none;margin-top:12px}.reply textarea{width:100%;min-height:90px;padding:10px;font:inherit;box-sizing:border-box}.status{margin:18px 0;font-weight:600}.badge{display:inline-block;padding:3px 7px;border-radius:10px;background:#eee;font-size:12px}.pending{background:#fff1c7}.approved{background:#dff3e5}.parent-note{font-size:12px;color:#777;margin:5px 0}</style></head><body><main><div class="top"><div><a href="/admin/">← Admin</a><h1>Коментари</h1></div><div class="controls"><button id="login" class="primary">Пријави се преко GitHub-а</button><button id="logout" class="secondary" hidden>Одјави се</button></div></div><p>Свака фотографија има своје дискусије. Унутар сваке дискусије одговор је приказан непосредно испод поруке на коју се односи.</p><div id="status" class="status">Проверавам пријаву…</div><div class="tabs" id="tabs" hidden><button class="action active" data-view="pending">На чекању</button><button class="action secondary" data-view="approved">Одобрени</button><button class="action secondary" data-view="all">Сви</button></div><div id="list"></div></main><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://kfpdzqwtninhdkwtjruc.supabase.co',SUPABASE_KEY='sb_publishable_a-kAHWFg9Kv3GFVGvxIjTg_c6QlqZbB',st=document.getElementById('status'),list=document.getElementById('list'),tabs=document.getElementById('tabs');let sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),comments=[],view='pending';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function login(){const {data,error}=await sb.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.origin+'/admin/comments.html',skipBrowserRedirect:true}});if(error){st.textContent=error.message;return}location.assign(data.url)}async function logout(){await sb.auth.signOut();location.reload()}const loginBtn=document.getElementById('login');loginBtn.onclick=login;document.getElementById('logout').onclick=logout;tabs.onclick=e=>{if(!e.target.dataset.view)return;view=e.target.dataset.view;[...tabs.children].forEach(b=>b.className='action '+(b.dataset.view===view?'active':'secondary'));render()};
function imageOf(c){if(c.image_ref)return c.image_ref;let x=c,seen=new Set;while(x&&x.parent_id&&!seen.has(x.id)){seen.add(x.id);x=comments.find(y=>y.id===x.parent_id);if(x&&x.image_ref)return x.image_ref}return null}function keyOf(c){return c.post_slug+'|'+(imageOf(c)||'__POST__')}function parentInfo(c){if(!c.parent_id)return'';const p=comments.find(x=>x.id===c.parent_id);return p?'<div class="parent-note">↳ Одговор на: <b>'+esc(p.author_name)+'</b> — '+esc(p.body).slice(0,120)+'</div>':''}function row(c){return '<div class="item"><div class="meta"><b>'+esc(c.author_name)+'</b> · '+new Date(c.created_at).toLocaleString('sr-RS')+' · <span class="badge '+(c.approved?'approved':'pending')+'">'+(c.approved?'Одобрен':'На чекању')+'</span></div>'+parentInfo(c)+'<div class="body">'+esc(c.body)+'</div><div class="actions">'+(c.approved?'':'<button class="action primary" onclick="approve('+c.id+')">Одобри</button>')+'<button class="action secondary" onclick="replyBox('+c.id+')">Одговори</button><button class="action danger" onclick="removeComment('+c.id+')">Обриши</button></div><div class="reply" id="r'+c.id+'"><textarea placeholder="Ваш одговор…"></textarea><button class="action primary" onclick="sendReply('+c.id+')">Објави одговор</button></div></div>'}function treeNode(c,arr){const kids=arr.filter(x=>x.parent_id===c.id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return row(c)+(kids.length?'<div class="children">'+kids.map(k=>treeNode(k,arr)).join('')+'</div>':'')}function threadTree(arr){const roots=arr.filter(c=>!c.parent_id||!arr.some(x=>x.id===c.parent_id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));return roots.map(r=>'<div class="root-thread">'+treeNode(r,arr)+'</div>').join('')}
function render(){const matching=c=>view==='all'||(view==='pending'?!c.approved:c.approved);const relevantKeys=new Set(comments.filter(matching).map(keyOf));if(!relevantKeys.size){list.innerHTML='<p>Нема коментара у овој групи.</p>';return}const groups={};comments.forEach(c=>{const k=keyOf(c);if(relevantKeys.has(k))(groups[k]||(groups[k]=[])).push(c)});const ordered=Object.entries(groups).sort((a,b)=>Math.min(...a[1].map(x=>new Date(x.created_at)))-Math.min(...b[1].map(x=>new Date(x.created_at))));list.innerHTML=ordered.map(([k,arr])=>{const first=arr.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))[0],img=imageOf(first);const head=img?'<div class="thread-head"><img src="'+esc(img)+'" alt=""><div><b>Дискусије на фотографију</b><small>Објава: '+esc(first.post_slug)+'</small></div></div>':'<div class="thread-head"><div><b>Дискусије на објаву</b><small>Објава: '+esc(first.post_slug)+'</small></div></div>';return '<section class="thread">'+head+threadTree(arr)+'</section>'}).join('')}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data}async function load(){st.textContent='Учитавање…';try{comments=await rpc('admin_list_comments',{});st.textContent='Пријављени сте као администратор.';render()}catch(e){st.textContent='Овај GitHub налог нема администраторски приступ.'}}async function approve(id){await rpc('admin_approve_comment',{p_id:id});await load()}function replyBox(id){const x=document.getElementById('r'+id);x.style.display=x.style.display==='block'?'none':'block'}async function sendReply(id){const ta=document.querySelector('#r'+id+' textarea');if(!ta.value.trim())return;await rpc('admin_reply_comment',{p_parent_id:id,p_body:ta.value.trim()});await load()}async function removeComment(id){if(!confirm('Да ли сигурно желите да обришете овај коментар?'))return;await rpc('admin_remove_comment',{p_id:id});await load()}(async()=>{const {data:{session}}=await sb.auth.getSession();if(session){loginBtn.hidden=true;document.getElementById('logout').hidden=false;tabs.hidden=false;await load()}else st.textContent='Пријавите се својим GitHub налогом да управљате коментарима.'})();</script></body></html>
