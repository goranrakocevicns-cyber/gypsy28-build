<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gypsy 28 — Коментари</title><link rel="stylesheet" href="/style.css">
<style>
main{max-width:900px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button,.action{border:0;padding:10px 14px;cursor:pointer;font:inherit}.primary{background:#16212a;color:#fff}.secondary{background:#eee}.danger{background:#8b2727;color:#fff}.tabs{display:flex;gap:8px;margin:24px 0}.tabs button.active{background:#16212a;color:#fff}.item{border:1px solid #ddd;padding:16px;margin:12px 0;border-radius:8px}.meta{font-size:13px;color:#667;margin-bottom:8px}.body{white-space:pre-wrap;font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.reply{display:none;margin-top:12px}.reply textarea{width:100%;min-height:90px;padding:10px;font:inherit;box-sizing:border-box}.status{margin:18px 0;font-weight:600}.badge{display:inline-block;padding:3px 7px;border-radius:10px;background:#eee;font-size:12px}.pending{background:#fff1c7}.approved{background:#dff3e5}
</style></head><body><main>
<div class="top"><div><a href="/admin/">← Admin</a><h1>Коментари</h1></div><div class="controls"><button id="login" class="primary">Пријави се преко GitHub-а</button><button id="logout" class="secondary" hidden>Одјави се</button></div></div>
<p>Овде одобравате, одговарате и бришете коментаре посетилаца.</p>
<div id="status" class="status">Проверавам пријаву…</div>
<div class="tabs" id="tabs" hidden><button class="action active" data-view="pending">На чекању</button><button class="action secondary" data-view="approved">Одобрени</button><button class="action secondary" data-view="all">Сви</button></div>
<div id="list"></div>
</main>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://kfpdzqwtninhdkwtjruc.supabase.co',SUPABASE_KEY='sb_publishable_a-kAHWFg9Kv3GFVGvxIjTg_c6QlqZbB';
const st=document.getElementById('status'),list=document.getElementById('list'),tabs=document.getElementById('tabs');
let sb;
try{
  if(!window.supabase || !window.supabase.createClient) throw new Error('Supabase библиотека није учитана.');
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
}catch(e){
  st.textContent='ТЕХНИЧКА ГРЕШКА: '+e.message;
  document.getElementById('login').disabled=true;
  throw e;
}
let comments=[],view='pending';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){
  st.textContent='Отварам GitHub пријаву…';
  try{
    const {data,error}=await sb.auth.signInWithOAuth({
      provider:'github',
      options:{redirectTo:location.origin+'/admin/comments.html',skipBrowserRedirect:true}
    });
    if(error)throw error;
    if(!data||!data.url)throw new Error('Supabase није вратио адресу за пријаву.');
    window.location.assign(data.url);
  }catch(e){
    console.error(e);
    st.textContent='Пријава није покренута: '+(e.message||e);
  }
}
async function logout(){await sb.auth.signOut();location.reload()}
document.getElementById('login').onclick=login;document.getElementById('logout').onclick=logout;
tabs.onclick=e=>{if(!e.target.dataset.view)return;view=e.target.dataset.view;[...tabs.children].forEach(b=>{b.className='action '+(b.dataset.view===view?'active':'secondary')});render()};
function render(){const rows=comments.filter(c=>view==='all'||(view==='pending'?!c.approved:c.approved));list.innerHTML=rows.length?rows.map(c=>`<div class="item"><div class="meta"><b>${esc(c.author_name)}</b> · ${new Date(c.created_at).toLocaleString('sr-RS')} · <span class="badge ${c.approved?'approved':'pending'}">${c.approved?'Одобрен':'На чекању'}</span><br>Објава: ${esc(c.post_slug)}</div><div class="body">${esc(c.body)}</div><div class="actions">${c.approved?'':'<button class="action primary" onclick="approve('+c.id+')">Одобри</button>'}<button class="action secondary" onclick="replyBox(${c.id})">Одговори</button><button class="action danger" onclick="removeComment(${c.id})">Обриши</button></div><div class="reply" id="r${c.id}"><textarea placeholder="Ваш одговор…"></textarea><button class="action primary" onclick="sendReply(${c.id})">Објави одговор</button></div></div>`).join(''):'<p>Нема коментара у овој групи.</p>'}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data}
async function load(){st.textContent='Учитавање…';try{comments=await rpc('admin_list_comments',{});st.textContent='Пријављени сте као администратор.';render()}catch(e){st.textContent='Овај GitHub налог нема администраторски приступ.'}}
async function approve(id){await rpc('admin_approve_comment',{p_id:id});await load()}
function replyBox(id){document.getElementById('r'+id).style.display='block'}
async function sendReply(id){const ta=document.querySelector('#r'+id+' textarea');if(!ta.value.trim())return;await rpc('admin_reply_comment',{p_parent_id:id,p_body:ta.value.trim()});await load()}
async function removeComment(id){if(!confirm('Да ли сигурно желите да обришете овај коментар?'))return;await rpc('admin_remove_comment',{p_id:id});await load()}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session){document.getElementById('login').hidden=true;document.getElementById('logout').hidden=false;tabs.hidden=false;await load()}else{st.textContent='Пријавите се својим GitHub налогом да управљате коментарима.'}})();
</script></body></html>
