<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gypsy 28 — Објаве</title><link rel="stylesheet" href="/gypsy28-build/style.css"><style>main{max-width:920px;margin:auto;padding:28px 18px 70px}.top,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.box{border:1px solid #ddd;border-radius:10px;padding:18px;margin:18px 0;background:#fafafa}label{display:grid;gap:6px;margin:12px 0;font-weight:700}input,textarea{font:inherit;padding:10px;border:1px solid #bbb}textarea{min-height:120px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;padding:10px 15px;cursor:pointer;font:inherit}.primary{background:#16212a;color:#fff}.danger{background:#8b2727;color:#fff}.secondary{background:#eee}.post{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #ddd;padding:12px 0}.photos{display:flex;gap:8px;flex-wrap:wrap}.thumb{position:relative}.thumb img{width:120px;height:90px;object-fit:cover}.thumb button{position:absolute;right:2px;top:2px;padding:2px 6px}.status{font-weight:700;margin:12px 0}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><a href="/gypsy28-build/admin/">← Admin</a><h1>Објаве</h1></div><button id="logout" class="secondary" hidden>Одјави се</button></div><div id="status" class="status">Проверавам пријаву…</div><section id="app" hidden><div class="actions"><h2 id="formTitle">Нова објава</h2><button id="new" class="secondary">Нова</button></div><form id="form" class="box"><input type="hidden" id="id"><div class="row"><label>Наслов (SR)<input id="title" required></label><label>Наслов (EN)<input id="title_en"></label></div><div class="row"><label>Категорија (SR)<input id="category"></label><label>Категорија (EN)<input id="category_en"></label></div><label>Кратак опис (SR)<textarea id="summary"></textarea></label><label>Кратак опис (EN)<textarea id="summary_en"></textarea></label><label>Текст (SR)<textarea id="body" required></textarea></label><label>Текст (EN)<textarea id="body_en"></textarea></label><label>Фотографије (до 25 MB по оригиналу; аутоматски WebP, max 1920 px)<input id="photos" type="file" accept="image/*" multiple></label><div id="existingPhotos" class="photos"></div><label><span><input id="published" type="checkbox" checked> Објављено</span></label><button class="primary">Сачувај објаву</button></form><h2>Постојеће објаве</h2><div id="list"></div></section></main><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script>
const URL='https://kfpdzqwtninhdkwtjruc.supabase.co',KEY='sb_publishable_a-kAHWFg9Kv3GFVGvxIjTg_c6QlqZbB',sb=supabase.createClient(URL,KEY),st=document.getElementById('status'),app=document.getElementById('app'),form=document.getElementById('form');let posts=[],existing=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function slugify(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9а-яђжљњћчш]+/gi,'-').replace(/^-|-$/g,'').slice(0,80)||'objava'}
async function imageWebp(file){if(file.size>25*1024*1024)throw Error(file.name+' је већа од 25 MB');const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}),scale=Math.min(1,1920/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close();return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(Error('Обрада слике није успела')),'image/webp',.84))}
async function uploadFiles(postId,files){let order=existing.length;for(const f of files){st.textContent='Обрађујем '+f.name+'…';const blob=await imageWebp(f),path=postId+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.webp';const {error}=await sb.storage.from('gypsy28-images').upload(path,blob,{contentType:'image/webp'});if(error)throw error;const public_url=sb.storage.from('gypsy28-images').getPublicUrl(path).data.publicUrl;const r=await sb.from('post_photos').insert({post_id:postId,storage_path:path,public_url,sort_order:order++});if(r.error)throw r.error}}
async function load(){const {data,error}=await sb.from('posts').select('*').order('published_at',{ascending:false});if(error)throw error;posts=data||[];$('list').innerHTML=posts.map(p=>`<div class="post"><div><b>${esc(p.title)}</b><br><small>${new Date(p.published_at).toLocaleString('sr-RS')}</small></div><div><button class="secondary" onclick="editPost(${p.id})">Измени</button> <button class="danger" onclick="delPost(${p.id})">Обриши</button></div></div>`).join('')||'<p>Нема објава.</p>'}
function clearForm(){form.reset();$('id').value='';$('published').checked=true;existing=[];$('existingPhotos').innerHTML='';$('formTitle').textContent='Нова објава'}$('new').onclick=clearForm;
async function editPost(id){const p=posts.find(x=>x.id===id);if(!p)return;for(const k of ['id','title','title_en','category','category_en','summary','summary_en','body','body_en'])$(k).value=p[k]??'';$('published').checked=p.published;const {data}=await sb.from('post_photos').select('*').eq('post_id',id).order('sort_order');existing=data||[];renderPhotos();$('formTitle').textContent='Измена објаве';scrollTo({top:0,behavior:'smooth'})}
function renderPhotos(){$('existingPhotos').innerHTML=existing.map(x=>`<div class="thumb"><img src="${esc(x.public_url)}"><button type="button" class="danger" onclick="removePhoto(${x.id})">×</button></div>`).join('')}
async function removePhoto(id){const x=existing.find(p=>p.id===id);if(!x||!confirm('Обрисати фотографију?'))return;if(x.storage_path)await sb.storage.from('gypsy28-images').remove([x.storage_path]);await sb.from('post_photos').delete().eq('id',id);existing=existing.filter(p=>p.id!==id);renderPhotos()}
async function delPost(id){if(!confirm('Обрисати целу објаву?'))return;const {data:ph}=await sb.from('post_photos').select('storage_path').eq('post_id',id);const paths=(ph||[]).map(x=>x.storage_path).filter(Boolean);if(paths.length)await sb.storage.from('gypsy28-images').remove(paths);const r=await sb.from('posts').delete().eq('id',id);if(r.error)return alert(r.error.message);clearForm();await load()}
form.onsubmit=async e=>{e.preventDefault();try{st.textContent='Чувам…';const id=+$('id').value||null,title=$('title').value.trim(),now=new Date(),payload={title,title_en:$('title_en').value.trim()||null,category:$('category').value.trim()||null,category_en:$('category_en').value.trim()||null,summary:$('summary').value.trim()||null,summary_en:$('summary_en').value.trim()||null,body:$('body').value,body_en:$('body_en').value,published:$('published').checked,updated_at:now.toISOString()};let postId=id;if(id){const r=await sb.from('posts').update(payload).eq('id',id).select().single();if(r.error)throw r.error;postId=r.data.id}else{payload.slug=now.toISOString().slice(0,10)+'-'+slugify(title);payload.published_at=now.toISOString();const r=await sb.from('posts').insert(payload).select().single();if(r.error)throw r.error;postId=r.data.id}await uploadFiles(postId,[...$('photos').files]);st.textContent='Сачувано.';clearForm();await load()}catch(err){console.error(err);st.textContent='Грешка: '+err.message}};
$('logout').onclick=async()=>{await sb.auth.signOut();location.href='/gypsy28-build/admin/'};(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/gypsy28-build/admin/';return}$('logout').hidden=false;app.hidden=false;st.textContent='Пријављени сте.';try{await load()}catch(e){st.textContent='Овај налог нема администраторски приступ.';app.hidden=true}})();
</script></body></html>
