backend:
  name: github
  repo: goranrakocevicns-cyber/gypsy28-build
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"
locale: "sr"

collections:
  - name: "posts"
    label: "Objave"
    label_singular: "Objava"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Naslov (SR)", name: "title", widget: "string" }
      - { label: "Naslov (EN)", name: "title_en", widget: "string", required: false }
      - { label: "Datum", name: "date", widget: "datetime" }
      - label: "Kategorija (SR)"
        name: "category"
        widget: "select"
        options: ["Izgradnja", "Materijali", "Izmene projekta", "Troškovi", "Galerija"]
      - { label: "Kategorija (EN)", name: "category_en", widget: "string", required: false }
      - label: "Fotografije objave"
        name: "gallery"
        widget: "list"
        required: false
        summary: "Fotografija {{index}}"
        minimize_collapsed: false
        field:
          label: "Fotografija"
          name: "image"
          widget: "image"
          choose_url: false
          media_library:
            config:
              multiple: false
      - { label: "Tekst (SR)", name: "body", widget: "markdown" }
      - { label: "Kratak opis (EN)", name: "summary_en", widget: "text", required: false }
