name: Backup Gypsy 28 content

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/backup-gypsy.yml']
  schedule:
    - cron: '27 2 * * *'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup published Supabase content and images
        run: |
          python3 - <<'PY'
          import json, urllib.request, pathlib, re, shutil
          loader=pathlib.Path('supabase-content-loader.js').read_text(encoding='utf-8')
          U=re.search(r"const U='([^']+)'",loader).group(1)
          K=re.search(r",K='([^']+)'",loader).group(1)
          H={'apikey':K}
          def get(path):
              r=urllib.request.Request(U+'/rest/v1/'+path,headers=H)
              return json.load(urllib.request.urlopen(r,timeout=30))
          posts=get('posts?published=eq.true&select=*&order=published_at.desc')
          photos=get('post_photos?select=post_id,public_url,storage_path,sort_order&order=sort_order.asc')
          by={}
          for x in photos: by.setdefault(x['post_id'],[]).append(x)
          root=pathlib.Path('backup-images')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(exist_ok=True)
          out=[]
          for p in posts:
              gallery=[]
              for x in by.get(p['id'],[]):
                  storage=x.get('storage_path')
                  src=x.get('public_url') or (U+'/storage/v1/object/public/gypsy28-images/'+storage if storage else '')
                  if not src: continue
                  name=str(p['id'])+'-'+pathlib.Path(storage or src.split('/')[-1]).name
                  dest=root/name
                  req=urllib.request.Request(src)
                  with urllib.request.urlopen(req,timeout=60) as r, open(dest,'wb') as f: f.write(r.read())
                  gallery.append('/gypsy28-build/backup-images/'+name)
              image=gallery[0] if gallery else (p.get('cover_url') or '')
              out.append({'slug':p['slug'],'title':p['title'],'title_en':p.get('title_en'),'date':p['published_at'],'category':p.get('category'),'category_en':p.get('category_en'),'image':image,'gallery':gallery,'body':p.get('body') or '','body_en':p.get('body_en') or '','summary':p.get('summary') or '','summary_en':p.get('summary_en') or ''})
          pathlib.Path('content/posts').mkdir(parents=True,exist_ok=True)
          pathlib.Path('content/posts/index.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('fallback-data.js').write_text('window.GYPSY_FALLBACK='+json.dumps(out,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          print(f'Backed up {len(posts)} published posts and {len(photos)} photo records')
          PY
      - name: Save backup in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/posts/index.json fallback-data.js backup-images/
          git diff --cached --quiet && exit 0
          git commit -m "Automatic Gypsy 28 content backup"
          git push
