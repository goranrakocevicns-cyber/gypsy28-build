name: Backup Gypsy 28 content

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backup-gypsy.yml'
  schedule:
    - cron: '27 2 * * *'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate current published content
        run: |
          set -euo pipefail
          ENDPOINT='https://kfpdzqwtninhdkwtjruc.supabase.co/functions/v1/gypsy-public-backup'
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
            "$ENDPOINT" -o /tmp/gypsy-backup.json
          python3 - <<'PY'
          import json, pathlib, shutil, urllib.request

          raw=json.load(open('/tmp/gypsy-backup.json',encoding='utf-8'))
          if not isinstance(raw,dict):
              raise SystemExit('Invalid backup response: expected JSON object')
          posts=raw.get('posts')
          photos=raw.get('photos',[])
          if not isinstance(posts,list) or not posts:
              raise SystemExit('Refusing to save an empty or invalid posts backup')
          if not isinstance(photos,list):
              raise SystemExit('Invalid backup response: photos must be a list')

          by={}
          for x in photos:
              if isinstance(x,dict) and x.get('post_id') is not None:
                  by.setdefault(x['post_id'],[]).append(x)

          root=pathlib.Path('backup-images')
          tmp=pathlib.Path('/tmp/gypsy-backup-images')
          if tmp.exists(): shutil.rmtree(tmp)
          tmp.mkdir(parents=True)
          out=[]
          downloaded=0

          for p in posts:
              if not isinstance(p,dict) or not p.get('id') or not p.get('slug') or not p.get('title'):
                  raise SystemExit('Invalid post in backup response')
              gallery=[]
              for x in by.get(p['id'],[]):
                  storage=x.get('storage_path')
                  src=x.get('public_url') or ('https://kfpdzqwtninhdkwtjruc.supabase.co/storage/v1/object/public/gypsy28-images/'+storage if storage else '')
                  if not src: continue
                  name=str(p['id'])+'-'+pathlib.Path(storage or src.split('/')[-1].split('?')[0]).name
                  try:
                      req=urllib.request.Request(src,headers={'User-Agent':'gypsy28-backup/1.0'})
                      with urllib.request.urlopen(req,timeout=60) as r, open(tmp/name,'wb') as f:
                          f.write(r.read())
                      gallery.append('/gypsy28-build/backup-images/'+name)
                      downloaded += 1
                  except Exception as e:
                      print('Image backup warning:',src,e)
              out.append({
                  'slug':p['slug'],'title':p['title'],'title_en':p.get('title_en'),
                  'date':p.get('published_at'),'category':p.get('category'),'category_en':p.get('category_en'),
                  'image':gallery[0] if gallery else (p.get('cover_url') or ''),'gallery':gallery,
                  'body':p.get('body') or '','body_en':p.get('body_en') or '',
                  'summary':p.get('summary') or '','summary_en':p.get('summary_en') or ''
              })

          pathlib.Path('content/posts').mkdir(parents=True,exist_ok=True)
          pathlib.Path('content/posts/index.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('fallback-data.js').write_text('window.GYPSY_FALLBACK='+json.dumps(out,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          if root.exists(): shutil.rmtree(root)
          shutil.move(str(tmp),str(root))
          print(f'BACKUP_OK posts={len(posts)} photos={len(photos)} downloaded_images={downloaded}')
          PY

      - name: Save backup in repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/posts/index.json fallback-data.js backup-images/
          if git diff --cached --quiet; then
            echo 'Backup verified; no content changes.'
            exit 0
          fi
          git commit -m "Automatic Gypsy 28 content backup"
          git pull --rebase origin main
          git push origin HEAD:main
