name: Deploy Gypsy 28 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Backup Gypsy 28 content"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Prepare GitHub Pages paths and force fresh live content
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          base='/gypsy28-build/'
          ver=os.environ.get('BUILD_SHA','live')[:12]
          local_roots=['style.css','site.js','live-refresh.js','gallery.html','post.html','admin/','content/','images/','.netlify/','api/']
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js','.css','.json'}: continue
              if '.git' in p.parts or '.github' in p.parts or 'node_modules' in p.parts: continue
              try:s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              original=s
              for root in local_roots:
                  s=s.replace('"/'+root,'"'+base+root).replace("'/"+root,"'"+base+root).replace('`/'+root,'`'+base+root)
              s=s.replace('href="/"','href="'+base+'"').replace("href='/'","href='"+base+"'")
              s=s.replace('href="/#dnevnik"','href="'+base+'#dnevnik"')
              s=s.replace(",Authorization:'Bearer '+SUPA_KEY","")
              s=s.replace(',Authorization:`Bearer ${SUPA_KEY}`','')
              if p.as_posix()=='admin/cms.html' and 'multi-photo-fix.js' not in s:
                  s=s.replace('</body>','<script src="'+base+'admin/multi-photo-fix.js?v='+ver+'"></script></body>')
              if p.name=='index.html':
                  s=re.sub(r'(/gypsy28-build/site\.js)(?:\?v=[^"\']*)?',r'\1?v='+ver,s)
                  s=re.sub(r'(/gypsy28-build/style\.css)(?:\?v=[^"\']*)?',r'\1?v='+ver,s)
              if p.name=='site.js':
                  s=re.sub(r"POST_VERSION='[^']*'","POST_VERSION='"+ver+"'",s)
              if s!=original:p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
