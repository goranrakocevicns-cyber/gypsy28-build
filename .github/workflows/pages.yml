name: Deploy Gypsy 28 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Fix local paths for GitHub Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = '/gypsy28-build/'
          local_roots = ['style.css','site.js','live-refresh.js','gallery.html','post.html','admin/','content/','images/','.netlify/','api/']
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js','.css','.json'}:
                  continue
              if '.git' in p.parts or '.github' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              for root in local_roots:
                  s = s.replace('"/' + root, '"' + base + root)
                  s = s.replace("'/" + root, "'" + base + root)
                  s = s.replace('`/' + root, '`' + base + root)
              s = s.replace('href="/"', 'href="' + base + '"')
              s = s.replace("href='/'", "href='" + base + "'")
              s = s.replace('href="/#dnevnik"', 'href="' + base + '#dnevnik"')
              if s != original:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Verify critical assets were rewritten
        run: |
          grep -q 'href="/gypsy28-build/style.css"' index.html
          grep -q '/gypsy28-build/' index.html
          grep -q 'href="/gypsy28-build/#dnevnik"' post.html
          grep -q 'href="/gypsy28-build/"' gallery.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
