<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Галерија — Gypsy 28 Build</title><link rel="stylesheet" href="/style.css"><style>main{max-width:1200px;margin:auto;padding:32px 20px 70px}.gallery-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}.gallery-head h1{margin:.2em 0}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.gallery-item{margin:0}.gallery-item button{display:block;width:100%;border:0;padding:0;background:#eef2f5;cursor:zoom-in;border-radius:9px;overflow:hidden}.gallery-item img{display:block;width:100%;height:210px;object-fit:cover}.gallery-item figcaption{font-size:13px;line-height:1.35;padding:7px 2px 14px;color:#59636a}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:9999}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:88vh;object-fit:contain}.lb-close,.lb-prev,.lb-next{position:absolute;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:38px;padding:12px;cursor:pointer}.lb-close{right:16px;top:8px}.lb-prev{left:8px}.lb-next{right:8px}.lb-caption{position:absolute;bottom:12px;left:10%;right:10%;text-align:center;color:#fff;font-size:14px}.empty{padding:30px 0;color:#667}@media(max-width:600px){.gallery-grid{grid-template-columns:repeat(2,1fr);gap:8px}.gallery-item img{height:150px}}</style></head><body><main><div class="gallery-head"><div><a href="/">← <span id="backText">Назад</span></a><p class="eyebrow" id="eyebrow">ГАЛЕРИЈА</p><h1 id="title">Фотографије изградње</h1><p id="intro">Све фотографије из дневника, поређане редом којим су објављене.</p></div><div class="lang-switch"><button type="button" data-lang="sr">SR</button><span>|</span><button type="button" data-lang="en">EN</button></div></div><div id="gallery" class="gallery-grid"><p class="empty">Учитавање…</p></div></main><div class="lightbox" id="lightbox"><button class="lb-close">×</button><button class="lb-prev">‹</button><img alt=""><button class="lb-next">›</button><div class="lb-caption"></div></div><script>
let lang=localStorage.getItem('gypsy-lang')||'sr',photos=[],ix=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const gallery=document.getElementById('gallery'),lb=document.getElementById('lightbox');function labels(){document.documentElement.lang=lang;document.title=lang==='en'?'Gallery — Gypsy 28 Build':'Галерија — Gypsy 28 Build';document.getElementById('backText').textContent=lang==='en'?'Back':'Назад';document.getElementById('eyebrow').textContent=lang==='en'?'GALLERY':'ГАЛЕРИЈА';document.getElementById('title').textContent=lang==='en'?'Build photographs':'Фотографије изградње';document.getElementById('intro').textContent=lang==='en'?'All photographs from the journal, in the order they were published.':'Све фотографије из дневника, поређане редом којим су објављене.';document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));render()}document.querySelectorAll('.lang-switch button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('gypsy-lang',lang);labels()});function render(){if(!photos.length)return;gallery.innerHTML=photos.map((p,i)=>`<figure class="gallery-item"><button type="button" data-i="${i}"><img src="${esc(p.src)}" loading="lazy" alt="${esc(lang==='en'?p.titleEn:p.title)}"></button><figcaption>${esc(lang==='en'?p.titleEn:p.title)}</figcaption></figure>`).join('');gallery.querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.i))}function show(i){if(!photos.length)return;ix=(i+photos.length)%photos.length;lb.querySelector('img').src=photos[ix].src;lb.querySelector('.lb-caption').textContent=lang==='en'?photos[ix].titleEn:photos[ix].title;lb.classList.add('open')}lb.querySelector('.lb-close').onclick=()=>lb.classList.remove('open');lb.querySelector('.lb-prev').onclick=()=>show(ix-1);lb.querySelector('.lb-next').onclick=()=>show(ix+1);lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')show(ix-1);if(e.key==='ArrowRight')show(ix+1)});let sx=0;lb.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX);lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)show(ix+(d<0?1:-1))});fetch('/content/posts/index.json',{cache:'no-store'}).then(r=>r.json()).then(posts=>{photos=[];posts.forEach(p=>{const seen=new Set();[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean).forEach(src=>{if(seen.has(src))return;seen.add(src);photos.push({src,title:p.title||'',titleEn:p.title_en||p.title||'',slug:p.slug})})});if(!photos.length){gallery.innerHTML='<p class="empty">'+(lang==='en'?'No photographs yet.':'Још нема фотографија.')+'</p>';return}labels()}).catch(()=>gallery.innerHTML='<p class="empty">Галерија тренутно није доступна.</p>');labels();</script></body></html>
