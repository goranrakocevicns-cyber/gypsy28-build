<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gypsy 28 Build</title><link rel="stylesheet" href="/style.css"><style>
.post-page{max-width:960px;margin:0 auto;padding:32px 20px 70px}.post-page>a{display:inline-block;margin-bottom:24px}.post-hero{width:100%;max-height:650px;object-fit:contain;background:#eef2f5;border-radius:12px;cursor:zoom-in}.post-body{font-size:1.08rem;line-height:1.75;white-space:pre-line}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:28px}.gallery img{width:100%;height:180px;object-fit:contain;background:#eef2f5;border-radius:8px;cursor:zoom-in}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain}.lb-close,.lb-prev,.lb-next{position:absolute;border:0;background:rgba(0,0,0,.35);color:white;font-size:36px;padding:12px;cursor:pointer}.lb-close{right:18px;top:10px}.lb-prev{left:10px}.lb-next{right:10px}
.comments{margin-top:58px;border-top:1px solid #d5d0c4;padding-top:30px}.comments h2{font-size:34px}.comment-form{display:grid;gap:10px;max-width:680px}.comment-form input,.comment-form textarea{font:inherit;padding:12px;border:1px solid #bbb;background:white}.comment-form textarea{min-height:110px;resize:vertical}.comment-form button,.reply-btn{width:max-content;border:0;background:#16212a;color:white;padding:10px 16px;font-weight:bold;cursor:pointer}.comment-note{font-size:13px;color:#59636a}.comment-status{font-size:14px;font-weight:bold}.comment-list{margin-top:30px}.comment{padding:16px 0;border-top:1px solid #ddd}.comment.reply{margin-left:32px;padding-left:16px;border-left:3px solid #ddd}.comment-head{display:flex;gap:10px;align-items:baseline}.comment-head b.author{color:#b85f38}.comment-time{font-size:12px;color:#777}.comment p{margin:7px 0 10px;white-space:pre-wrap}.reply-btn{background:none;color:#16212a;padding:0;border-bottom:1px solid #b85f38}.reply-form{margin:10px 0 0 32px}.photo-comments{margin:10px 0 26px;padding:12px;border:1px solid #ddd;border-radius:8px}.photo-comments summary{cursor:pointer;font-weight:700}.photo-comment-form{display:grid;gap:8px;margin-top:12px}.photo-comment-form input,.photo-comment-form textarea{font:inherit;padding:10px;border:1px solid #bbb}.photo-comment-form textarea{min-height:72px}.photo-comment-form button{width:max-content;border:0;background:#16212a;color:#fff;padding:9px 14px;font-weight:700}.photo-comment-list .comment{padding:10px 0}
</style></head><body><main class="post-page"><a href="/#dnevnik" id="back">← Назад на дневник</a><article id="post">Учитавање…</article><section class="comments" id="comments"><h2 id="comments-title">Коментари</h2><form class="comment-form" id="comment-form"><input id="comment-name" maxlength="80" required placeholder="Ваше име"><textarea id="comment-body" maxlength="3000" required placeholder="Ваш коментар"></textarea><button type="submit">Пошаљи коментар</button><div class="comment-note">Коментар ће бити видљив након одобрења аутора сајта.</div><div class="comment-status" id="comment-status"></div></form><div class="comment-list" id="comment-list"></div></section></main><div class="lightbox" id="lightbox"><button class="lb-close">×</button><button class="lb-prev">‹</button><img alt=""><button class="lb-next">›</button></div>
<script>
const SUPA_URL='https://kfpdzqwtninhdkwtjruc.supabase.co',SUPA_KEY='sb_publishable_a-kAHWFg9Kv3GFVGvxIjTg_c6QlqZbB';
const lang=localStorage.getItem('gypsy-lang')||'sr',slug=new URLSearchParams(location.search).get('post');document.documentElement.lang=lang;document.getElementById('back').textContent=lang==='en'?'← Back to journal':'← Назад на дневник';let imgs=[],ix=0;const lb=document.getElementById('lightbox');function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(i){if(!imgs.length)return;ix=(i+imgs.length)%imgs.length;lb.querySelector('img').src=imgs[ix];lb.classList.add('open')}function bind(){document.querySelectorAll('.zoomable').forEach((im,i)=>im.onclick=()=>show(i));lb.querySelector('.lb-close').onclick=()=>lb.classList.remove('open');lb.querySelector('.lb-prev').onclick=()=>show(ix-1);lb.querySelector('.lb-next').onclick=()=>show(ix+1);lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};let x=0;lb.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX);lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-x;if(Math.abs(d)>45)show(ix+(d<0?1:-1))})}
async function api(path,opt={}){const h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(SUPA_URL+'/rest/v1/'+path,{...opt,headers:h});if(!r.ok)throw new Error(await r.text());if(r.status===204||r.status===201&&h.Prefer==='return=minimal')return null;const t=await r.text();return t?JSON.parse(t):null}
function commentHtml(c,depth=0){const who=c.is_author?(lang==='en'?'Gypsy 28 Build — author':'Gypsy 28 Build — аутор'):esc(c.author_name);return '<div class="comment '+(depth?'reply':'')+'"><div class="comment-head"><b class="'+(c.is_author?'author':'')+'">'+who+'</b><span class="comment-time">'+new Date(c.created_at).toLocaleDateString(lang==='en'?'en-GB':'sr-RS')+'</span></div><p>'+esc(c.body)+'</p></div>'}
async function loadComments(){const box=document.getElementById('comment-list');try{const cs=await api('comments?post_slug=eq.'+encodeURIComponent(slug)+'&image_ref=is.null&approved=eq.true&select=id,parent_id,author_name,body,is_author,created_at&order=created_at.asc');const roots=cs.filter(c=>!c.parent_id),kids=id=>cs.filter(c=>c.parent_id===id);box.innerHTML=roots.length?roots.map(c=>commentHtml(c)+kids(c.id).map(x=>commentHtml(x,1)).join('')).join(''):'<p class="comment-note">'+(lang==='en'?'No comments yet. Be the first to comment.':'Још нема коментара. Будите први који ће оставити коментар.')+'</p>'}catch(e){box.innerHTML='<p class="comment-note">'+(lang==='en'?'Comments are temporarily unavailable.':'Коментари тренутно нису доступни.')+'</p>'}}
document.getElementById('comment-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,btn=form.querySelector('button'),name=document.getElementById('comment-name'),body=document.getElementById('comment-body'),st=document.getElementById('comment-status');if(btn.disabled)return;btn.disabled=true;st.textContent=lang==='en'?'Sending…':'Шаљем…';try{await api('comments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({post_slug:slug,author_name:name.value.trim(),body:body.value.trim()})});name.value='';body.value='';st.textContent=lang==='en'?'Thank you. Your comment is awaiting approval.':'Хвала. Ваш коментар чека одобрење.'}catch(e){st.textContent=lang==='en'?'Comment could not be sent.':'Коментар није могао да буде послат.'}finally{btn.disabled=false}}
function photoCommentsHtml(src,i){const id='pc'+i;return '<details class="photo-comments"><summary>'+(lang==='en'?'Comments on this photo':'Коментари на ову слику')+'</summary><form class="photo-comment-form" data-img="'+esc(src)+'"><input maxlength="80" required placeholder="'+(lang==='en'?'Your name':'Ваше име')+'"><textarea maxlength="3000" required placeholder="'+(lang==='en'?'Your comment':'Ваш коментар')+'"></textarea><button type="submit">'+(lang==='en'?'Send':'Пошаљи')+'</button><div class="comment-status"></div></form><div class="photo-comment-list" id="'+id+'"></div></details>'}
async function loadPhotoComments(){for(let i=0;i<imgs.length;i++){const box=document.getElementById('pc'+i);if(!box)continue;try{const cs=await api('comments?post_slug=eq.'+encodeURIComponent(slug)+'&image_ref=eq.'+encodeURIComponent(imgs[i])+'&approved=eq.true&select=id,parent_id,author_name,body,is_author,created_at&order=created_at.asc');const roots=cs.filter(c=>!c.parent_id),kids=id=>cs.filter(c=>c.parent_id===id);box.innerHTML=roots.length?roots.map(c=>commentHtml(c)+kids(c.id).map(x=>commentHtml(x,1)).join('')).join(''):''}catch(e){}}}
document.addEventListener('submit',async e=>{const form=e.target.closest('.photo-comment-form');if(!form)return;e.preventDefault();const btn=form.querySelector('button'),name=form.querySelector('input'),body=form.querySelector('textarea'),st=form.querySelector('.comment-status');if(btn.disabled)return;btn.disabled=true;st.textContent=lang==='en'?'Sending…':'Шаљем…';try{await api('comments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({post_slug:slug,image_ref:form.dataset.img,author_name:name.value.trim(),body:body.value.trim()})});name.value='';body.value='';st.textContent=lang==='en'?'Thank you. Awaiting approval.':'Хвала. Коментар чека одобрење.'}catch(err){st.textContent=lang==='en'?'Could not send.':'Коментар није могао да буде послат.'}finally{btn.disabled=false}});
if(lang==='en'){document.getElementById('comments-title').textContent='Comments';document.getElementById('comment-name').placeholder='Your name';document.getElementById('comment-body').placeholder='Your comment';document.querySelector('#comment-form button').textContent='Send comment';document.querySelector('.comment-note').textContent='The comment will appear after approval by the site author.'}
fetch('/content/posts/index.json',{cache:'no-store'}).then(r=>r.json()).then(ps=>{const p=ps.find(x=>x.slug===slug);if(!p)throw 0;const en=lang==='en',title=en?(p.title_en||p.title):p.title,cat=en?(p.category_en||p.category):p.category,body=en?(p.body_en||p.summary_en||p.summary):(p.body||p.summary);imgs=[p.image,...(p.gallery||[])].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);document.title=title+' — Gypsy 28 Build';const hero=imgs[0]||'';const rest=imgs.slice(1);document.getElementById('post').innerHTML='<span>'+esc(cat||'')+'</span><h1>'+esc(title)+'</h1>'+(hero?'<img class="post-hero zoomable" src="'+esc(hero)+'" alt="'+esc(title)+'">'+photoCommentsHtml(hero,0):'')+'<div class="post-body">'+esc(body||'')+'</div>'+(rest.length?'<div class="gallery">'+rest.map((x,i)=>'<div><img class="zoomable" src="'+esc(x)+'" loading="lazy" alt="">'+photoCommentsHtml(x,i+1)+'</div>').join('')+'</div>':'');bind();loadComments();loadPhotoComments()}).catch(()=>document.getElementById('post').textContent=lang==='en'?'Post not found.':'Објава није пронађена.');
</script></body></html>
