<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gypsy 28 Build</title><link rel="stylesheet" href="/gypsy28-build/style.css"><style>.post-page{max-width:960px;margin:0 auto;padding:32px 20px 70px}.post-page>a{display:inline-block;margin-bottom:24px}.post-body{font-size:1.08rem;line-height:1.75;white-space:pre-line}.post-photo{margin:34px 0}.post-photo img{width:100%;max-height:650px;object-fit:contain;background:#eef2f5;border-radius:12px;cursor:zoom-in}.gallery{display:block;margin-top:30px}.comments,.photo-comments{margin:20px 0 34px;border:1px solid #ddd;border-radius:8px;padding:12px}.comments summary,.photo-comments summary{cursor:pointer;font-weight:700}.comments summary{font-size:24px}.comment-form,.public-reply-form,.photo-comment-form{display:grid;gap:10px;max-width:680px;margin-top:16px;padding-top:14px;border-top:1px solid #ddd}.comment-form input,.comment-form textarea,.public-reply-form input,.public-reply-form textarea,.photo-comment-form input,.photo-comment-form textarea{font:inherit;padding:12px;border:1px solid #bbb;background:white}.comment-form textarea,.public-reply-form textarea,.photo-comment-form textarea{min-height:90px;resize:vertical}.comment-form button,.public-reply-form button,.photo-comment-form button{width:max-content;border:0;background:#16212a;color:white;padding:10px 16px;font-weight:bold;cursor:pointer}.comment-note{font-size:13px;color:#59636a}.comment-status{font-size:14px;font-weight:bold}.comment-list{margin-top:16px}.comment{padding:14px 0;border-top:1px solid #ddd}.comment.reply{margin-left:min(28px,5vw);padding-left:14px;border-left:3px solid #ddd}.comment-head{display:flex;gap:10px;align-items:baseline}.comment-head b.author{color:#b85f38}.comment-time{font-size:12px;color:#777}.comment p{margin:7px 0 8px;white-space:pre-wrap}.reply-link{border:0;background:none;color:#16212a;padding:0;border-bottom:1px solid #b85f38;cursor:pointer;font:inherit;font-size:13px}.inline-reply{margin:10px 0 4px;display:none}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain}.lb-close,.lb-prev,.lb-next{position:absolute;border:0;background:rgba(0,0,0,.35);color:white;font-size:36px;padding:12px;cursor:pointer}.lb-close{right:18px;top:10px}.lb-prev{left:10px}.lb-next{right:10px}</style></head><body><main class="post-page"><a href="/gypsy28-build/#dnevnik" id="back">← Назад на дневник</a><article id="post">Учитавање…</article></main><div class="lightbox" id="lightbox"><button class="lb-close">×</button><button class="lb-prev">‹</button><img alt=""><button class="lb-next">›</button></div><script>
const POSTS_URL='https://kfpdzqwtninhdkwtjruc.supabase.co/functions/v1/public-posts',COMMENTS_URL='https://kfpdzqwtninhdkwtjruc.supabase.co/functions/v1/public-comments',BASE='/gypsy28-build/';const lang=localStorage.getItem('gypsy-lang')||'sr',slug=new URLSearchParams(location.search).get('post');document.documentElement.lang=lang;document.getElementById('back').textContent=lang==='en'?'← Back to journal':'← Назад на дневник';let imgs=[],ix=0,allComments=[];const lb=document.getElementById('lightbox');const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const media=src=>{if(!src)return'';const s=String(src);if(/^https?:\/\//i.test(s))return s;if(s.startsWith(BASE))return s;return BASE+s.replace(/^\//,'')};
function show(i){if(!imgs.length)return;ix=(i+imgs.length)%imgs.length;lb.querySelector('img').src=media(imgs[ix]);lb.classList.add('open')}function bind(){document.querySelectorAll('.zoomable').forEach((im,i)=>im.onclick=()=>show(i));lb.querySelector('.lb-close').onclick=()=>lb.classList.remove('open');lb.querySelector('.lb-prev').onclick=()=>show(ix-1);lb.querySelector('.lb-next').onclick=()=>show(ix+1);lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')}}
function children(id){return allComments.filter(c=>c.parent_id===id)}function tree(c,d=0){const who=c.is_author?(lang==='en'?'Gypsy 28 Build — author':'Gypsy 28 Build — аутор'):esc(c.author_name);return '<div class="comment '+(d?'reply':'')+'"><div class="comment-head"><b class="'+(c.is_author?'author':'')+'">'+who+'</b><span class="comment-time">'+new Date(c.created_at).toLocaleDateString(lang==='en'?'en-GB':'sr-RS')+'</span></div><p>'+esc(c.body)+'</p><button class="reply-link" data-reply="'+c.id+'">'+(lang==='en'?'Reply':'Одговори')+'</button><form class="public-reply-form inline-reply" id="reply-'+c.id+'" data-parent="'+c.id+'" data-img="'+esc(c.image_ref||'')+'"><input maxlength="80" required placeholder="'+(lang==='en'?'Your name':'Ваше име')+'"><textarea maxlength="3000" required placeholder="'+(lang==='en'?'Your reply':'Ваш одговор')+'"></textarea><button>'+(lang==='en'?'Send reply':'Пошаљи одговор')+'</button><div class="comment-status"></div></form>'+children(c.id).map(k=>tree(k,d+1)).join('')+'</div>'}
function roots(img){return allComments.filter(c=>!c.parent_id&&(img===null?!c.image_ref:c.image_ref===img))}function countFor(img){return allComments.filter(c=>img===null?!c.image_ref:c.image_ref===img).length}function renderComments(){const box=document.getElementById('comment-list'),title=document.getElementById('comments-title');if(title)title.textContent=(lang==='en'?'Discussion about the post':'Дискусија о објави')+' ('+countFor(null)+')';if(box)box.innerHTML=roots(null).map(c=>tree(c)).join('')||'<p class="comment-note">'+(lang==='en'?'No comments yet.':'Још нема коментара.')+'</p>';imgs.forEach((img,i)=>{const b=document.getElementById('pc'+i),s=document.getElementById('pcs'+i);if(b)b.innerHTML=roots(img).map(c=>tree(c)).join('');if(s)s.textContent=(lang==='en'?'Comments on this photo':'Коментари на ову слику')+' ('+countFor(img)+')'})}
async function loadComments(){try{const r=await fetch(COMMENTS_URL+'?post_slug='+encodeURIComponent(slug)+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(await r.text());allComments=await r.json();renderComments()}catch(e){console.error('COMMENTS LOAD FAILED',e)}}
async function submit(form,p){const btn=form.querySelector('button'),st=form.querySelector('.comment-status');btn.disabled=true;st.textContent=lang==='en'?'Sending…':'Шаљем…';try{const r=await fetch(COMMENTS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});if(!r.ok)throw new Error(await r.text());form.querySelectorAll('input,textarea').forEach(x=>x.value='');st.textContent=lang==='en'?'Thank you. Awaiting approval.':'Хвала. Коментар чека одобрење.'}catch(e){console.error(e);st.textContent=lang==='en'?'Could not send.':'Коментар није могао да буде послат.'}finally{btn.disabled=false}}
document.addEventListener('click',e=>{const r=e.target.closest('[data-reply]');if(r){const f=document.getElementById('reply-'+r.dataset.reply);if(f)f.style.display=f.style.display==='grid'?'none':'grid'}});document.addEventListener('submit',e=>{const f=e.target;if(f.matches('.comment-form')){e.preventDefault();submit(f,{post_slug:slug,author_name:f.querySelector('input').value.trim(),body:f.querySelector('textarea').value.trim()})}else if(f.matches('.photo-comment-form')){e.preventDefault();submit(f,{post_slug:slug,image_ref:f.dataset.img,author_name:f.querySelector('input').value.trim(),body:f.querySelector('textarea').value.trim()})}else if(f.matches('.public-reply-form')){e.preventDefault();submit(f,{post_slug:slug,image_ref:f.dataset.img||null,parent_id:Number(f.dataset.parent),author_name:f.querySelector('input').value.trim(),body:f.querySelector('textarea').value.trim()})}});
function discussion(){return '<details class="comments"><summary id="comments-title">'+(lang==='en'?'Discussion about the post (0)':'Дискусија о објави (0)')+'</summary><div id="comment-list" class="comment-list"></div><form class="comment-form"><input maxlength="80" required placeholder="'+(lang==='en'?'Your name':'Ваше име')+'"><textarea maxlength="3000" required placeholder="'+(lang==='en'?'Leave a comment about the post':'Оставите коментар на објаву')+'"></textarea><button>'+(lang==='en'?'Send comment':'Пошаљи коментар')+'</button><div class="comment-note">'+(lang==='en'?'The comment will appear after approval by the site author.':'Коментар ће бити видљив након одобрења аутора сајта.')+'</div><div class="comment-status"></div></form></details>'}function photoComments(src,i){return '<details class="photo-comments"><summary id="pcs'+i+'">'+(lang==='en'?'Comments on this photo (0)':'Коментари на ову слику (0)')+'</summary><div id="pc'+i+'"></div><form class="photo-comment-form" data-img="'+esc(src)+'"><input maxlength="80" required placeholder="'+(lang==='en'?'Your name':'Ваше име')+'"><textarea maxlength="3000" required placeholder="'+(lang==='en'?'Leave a comment':'Оставите коментар')+'"></textarea><button>'+(lang==='en'?'Send':'Пошаљи')+'</button><div class="comment-status"></div></form></details>'}function photo(src,i,title){return '<div class="post-photo"><img class="zoomable" src="'+esc(media(src))+'" loading="lazy" alt="'+esc(title)+'">'+photoComments(src,i)+'</div>'}
async function loadPost(){const box=document.getElementById('post');try{const r=await fetch(POSTS_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const posts=await r.json(),p=posts.find(x=>x.slug===slug);if(!p)throw new Error('Post not found');const en=lang==='en',title=en?(p.title_en||p.title):p.title,body=en?(p.body_en||p.body||p.summary_en||p.summary):(p.body||p.summary),cat=en?(p.category_en||p.category):p.category;imgs=[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);document.title=title+' — Gypsy 28 Build';box.innerHTML='<span>'+esc(cat||'')+'</span><h1>'+esc(title)+'</h1><div class="post-body">'+esc(body||'')+'</div>'+discussion()+(imgs.length?'<div class="gallery">'+imgs.map((src,i)=>photo(src,i,title)).join('')+'</div>':'');bind();loadComments()}catch(e){console.error(e);box.innerHTML='<p>Objava trenutno nije dostupna. Osvežite stranicu.</p>'}}loadPost();
</script></body></html>
