<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gypsy 28 Build</title>
<link rel="stylesheet" href="/gypsy28-build/style.css">
<style>
.post-page{max-width:960px;margin:0 auto;padding:32px 20px 70px}.post-page>a{display:inline-block;margin-bottom:24px}.post-body{font-size:1.08rem;line-height:1.75;white-space:pre-line}.gallery{display:block;margin-top:30px}.post-photo{margin:34px 0}.post-photo img{width:100%;max-height:650px;object-fit:contain;background:#eef2f5;border-radius:12px;cursor:zoom-in}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain}.lb-close,.lb-prev,.lb-next{position:absolute;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:36px;padding:12px;cursor:pointer}.lb-close{right:18px;top:10px}.lb-prev{left:10px}.lb-next{right:10px}
</style>
</head>
<body>
<main class="post-page"><a href="/gypsy28-build/#dnevnik" id="back">← Назад на дневnik</a><article id="post">Учитавање…</article></main>
<div class="lightbox" id="lightbox"><button class="lb-close">×</button><button class="lb-prev">‹</button><img alt=""><button class="lb-next">›</button></div>
<script>
const LIVE_URL='https://kfpdzqwtninhdkwtjruc.supabase.co/functions/v1/public-posts';
const BASE='/gypsy28-build/';
const lang=localStorage.getItem('gypsy-lang')||'sr';
const slug=new URLSearchParams(location.search).get('post');
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const media=s=>{s=String(s||'');if(/^https?:\/\//i.test(s))return s;if(s.startsWith(BASE))return s;return BASE+s.replace(/^\//,'')};
document.documentElement.lang=lang;
document.getElementById('back').textContent=lang==='en'?'← Back to journal':'← Назад на дневник';
let imgs=[],ix=0;const lb=document.getElementById('lightbox');
function show(i){if(!imgs.length)return;ix=(i+imgs.length)%imgs.length;lb.querySelector('img').src=media(imgs[ix]);lb.classList.add('open')}
function bind(){document.querySelectorAll('.zoomable').forEach((im,i)=>im.onclick=()=>show(i));lb.querySelector('.lb-close').onclick=()=>lb.classList.remove('open');lb.querySelector('.lb-prev').onclick=()=>show(ix-1);lb.querySelector('.lb-next').onclick=()=>show(ix+1);lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')}}
async function loadPost(){const box=document.getElementById('post');try{const r=await fetch(LIVE_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Live posts '+r.status+' '+await r.text());const posts=await r.json();if(!Array.isArray(posts))throw new Error('Invalid live payload');const p=posts.find(x=>x.slug===slug);if(!p)throw new Error('Post not found: '+slug);const en=lang==='en';const title=en?(p.title_en||p.title):p.title;const body=en?(p.body_en||p.body||p.summary_en||p.summary):(p.body||p.summary);const cat=en?(p.category_en||p.category):p.category;imgs=[p.image,...(Array.isArray(p.gallery)?p.gallery:[])].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);document.title=title+' — Gypsy 28 Build';box.innerHTML='<span>'+esc(cat||'')+'</span><h1>'+esc(title)+'</h1><div class="post-body">'+esc(body||'')+'</div>'+(imgs.length?'<div class="gallery">'+imgs.map((src,i)=>'<div class="post-photo"><img class="zoomable" src="'+esc(media(src))+'" loading="lazy" alt="'+esc(title)+'"></div>').join('')+'</div>':'');bind();}catch(e){console.error('LIVE POST FAILED',e);box.innerHTML='<p>Objava trenutno nije dostupna. Osvežite stranicu.</p>';}}
loadPost();
</script>
</body>
</html>
