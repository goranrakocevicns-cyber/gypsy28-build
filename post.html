<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gypsy 28 Build</title><link rel="stylesheet" href="/style.css"><style>.post-page{max-width:960px;margin:0 auto;padding:32px 20px 70px}.post-page>a{display:inline-block;margin-bottom:24px}.post-hero{width:100%;max-height:650px;object-fit:contain;background:#eef2f5;border-radius:12px;cursor:zoom-in}.post-body{font-size:1.08rem;line-height:1.75;white-space:pre-line}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:28px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:8px;cursor:zoom-in}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain}.lb-close,.lb-prev,.lb-next{position:absolute;border:0;background:rgba(0,0,0,.35);color:white;font-size:36px;padding:12px;cursor:pointer}.lb-close{right:18px;top:10px}.lb-prev{left:10px}.lb-next{right:10px}</style></head><body><main class="post-page"><a href="/#dnevnik" id="back">← Назад на дневник</a><article id="post">Учитавање…</article></main><div class="lightbox" id="lightbox"><button class="lb-close">×</button><button class="lb-prev">‹</button><img alt=""><button class="lb-next">›</button></div><script>
const lang=localStorage.getItem('gypsy-lang')||'sr',slug=new URLSearchParams(location.search).get('post');document.documentElement.lang=lang;document.getElementById('back').textContent=lang==='en'?'← Back to journal':'← Назад на дневник';let imgs=[],ix=0;const lb=document.getElementById('lightbox');function show(i){ix=(i+imgs.length)%imgs.length;lb.querySelector('img').src=imgs[ix];lb.classList.add('open')}function bind(){document.querySelectorAll('.zoomable').forEach((im,i)=>im.onclick=()=>show(i));lb.querySelector('.lb-close').onclick=()=>lb.classList.remove('open');lb.querySelector('.lb-prev').onclick=()=>show(ix-1);lb.querySelector('.lb-next').onclick=()=>show(ix+1);lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};let x=0;lb.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX);lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-x;if(Math.abs(d)>45)show(ix+(d<0?1:-1))})}fetch('/content/posts/index.json',{cache:'no-store'}).then(r=>r.json()).then(ps=>{const p=ps.find(x=>x.slug===slug);if(!p)throw 0;const en=lang==='en',title=en?(p.title_en||p.title):p.title,cat=en?(p.category_en||p.category):p.category,body=en?(p.body_en||p.summary_en||p.summary):(p.body||p.summary);imgs=[p.image,...(p.gallery||[])].filter(Boolean);document.title=title+' — Gypsy 28 Build';document.getElementById('post').innerHTML=`<span>${cat||''}</span><h1>${title}</h1>${p.image?`<img class="post-hero zoomable" src="${p.image}" alt="${title}">`:''}<div class="post-body">${body||''}</div>${p.gallery&&p.gallery.length?`<div class="gallery">${p.gallery.map(x=>`<img class="zoomable" src="${x}" loading="lazy">`).join('')}</div>`:''}`;bind()}).catch(()=>document.getElementById('post').textContent=lang==='en'?'Post not found.':'Објава није пронађена.');
</script></body></html>
