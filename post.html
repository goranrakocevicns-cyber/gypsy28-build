<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gypsy 28 Build</title><link rel="stylesheet" href="/style.css"><style>.post-page{max-width:960px;margin:0 auto;padding:32px 20px 70px}.post-page>a{display:inline-block;margin-bottom:24px}.post-body{font-size:1.08rem;line-height:1.75;white-space:pre-line}.post-photo{margin:34px 0}.post-photo img{width:100%;max-height:650px;object-fit:contain;background:#eef2f5;border-radius:12px;cursor:zoom-in}.gallery{display:block;margin-top:30px}.comments{margin:28px 0 45px;border-top:1px solid #d5d0c4;padding-top:20px}.comments h2{font-size:28px}.comment-form,.public-reply-form,.photo-comment-form{display:grid;gap:10px;max-width:680px}.comment-form input,.comment-form textarea,.public-reply-form input,.public-reply-form textarea,.photo-comment-form input,.photo-comment-form textarea{font:inherit;padding:12px;border:1px solid #bbb;background:white}.comment-form textarea,.public-reply-form textarea,.photo-comment-form textarea{min-height:90px;resize:vertical}.comment-form button,.public-reply-form button,.photo-comment-form button{width:max-content;border:0;background:#16212a;color:white;padding:10px 16px;font-weight:bold;cursor:pointer}.comment-note{font-size:13px;color:#59636a}.comment-status{font-size:14px;font-weight:bold}.comment-list{margin-top:16px}.comment{padding:14px 0;border-top:1px solid #ddd}.comment.reply{margin-left:min(28px,5vw);padding-left:14px;border-left:3px solid #ddd}.comment.reply .comment.reply .comment.reply{margin-left:0}.comment-head{display:flex;gap:10px;align-items:baseline}.comment-head b.author{color:#b85f38}.comment-time{font-size:12px;color:#777}.comment p{margin:7px 0 8px;white-space:pre-wrap}.reply-link{border:0;background:none;color:#16212a;padding:0;border-bottom:1px solid #b85f38;cursor:pointer;font:inherit;font-size:13px}.inline-reply{margin:10px 0 4px;display:none}.photo-comments{margin:10px 0 26px;padding:12px;border:1px solid #ddd;border-radius:8px}.photo-comments summary{cursor:pointer;font-weight:700}.photo-comment-form{margin-top:16px;padding-top:14px;border-top:1px solid #ddd}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain}.lb-close,.lb-prev,.lb-next{position:absolute;border:0;background:rgba(0,0,0,.35);color:white;font-size:36px;padding:12px;cursor:pointer}.lb-close{right:18px;top:10px}.lb-prev{left:10px}.lb-next{right:10px}@media(max-width:650px){.comment.reply{margin-left:14px;padding-left:10px}}</style></head><body><main class="post-page"><a href="/#dnevnik" id="back">← Назад на дневник</a><article id="post">Учитавање…</article></main><div class="lightbox" id="lightbox"><button class="lb-close">×</button><button class="lb-prev">‹</button><img alt=""><button class="lb-next">›</button></div><script>
const SUPA_URL='https://kfpdzqwtninhdkwtjruc.supabase.co',SUPA_KEY='sb_publishable_a-kAHWFg9Kv3GFVGvxIjTg_c6QlqZbB';const lang=localStorage.getItem('gypsy-lang')||'sr',slug=new URLSearchParams(location.search).get('post');document.documentElement.lang=lang;document.getElementById('back').textContent=lang==='en'?'← Back to journal':'← Назад на дневник';let imgs=[],ix=0,allComments=[];const lb=document.getElementById('lightbox');const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(i){if(!imgs.length)return;ix=(i+imgs.length)%imgs.length;lb.querySelector('img').src=imgs[ix];lb.classList.add('open')}function bind(){document.querySelectorAll('.zoomable').forEach(im=>im.onclick=()=>show(imgs.indexOf(im.getAttribute('src'))));lb.querySelector('.lb-close').onclick=()=>lb.classList.remove('open');lb.querySelector('.lb-prev').onclick=()=>show(ix-1);lb.querySelector('.lb-next').onclick=()=>show(ix+1);lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')}}async function api(path,opt={}){const h={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(SUPA_URL+'/rest/v1/'+path,{...opt,headers:h});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
function children(id){return allComments.filter(c=>c.parent_id===id)}function commentTree(c,depth=0){const who=c.is_author?(lang==='en'?'Gypsy 28 Build — author':'Gypsy 28 Build — аутор'):esc(c.author_name),kids=children(c.id);return '<div class="comment '+(depth?'reply':'')+'"><div class="comment-head"><b class="'+(c.is_author?'author':'')+'">'+who+'</b><span class="comment-time">'+new Date(c.created_at).toLocaleDateString(lang==='en'?'en-GB':'sr-RS')+'</span></div><p>'+esc(c.body)+'</p><button class="reply-link" type="button" data-reply="'+c.id+'">'+(lang==='en'?'Reply':'Одговори')+'</button><form class="public-reply-form inline-reply" id="reply-'+c.id+'" data-parent="'+c.id+'" data-img="'+esc(c.image_ref||'')+'"><input maxlength="80" required placeholder="'+(lang==='en'?'Your name':'Ваше име')+'"><textarea maxlength="3000" required placeholder="'+(lang==='en'?'Your reply':'Ваш одговор')+'"></textarea><button>'+(lang==='en'?'Send reply':'Пошаљи одговор')+'</button><div class="comment-status"></div></form>'+kids.map(k=>commentTree(k,depth+1)).join('')+'</div>'}function rootsFor(img){return allComments.filter(c=>!c.parent_id&&(img===null?!c.image_ref:c.image_ref===img))}function descendants(c){return 1+children(c.id).reduce((n,k)=>n+descendants(k),0)}function count(rs){return rs.reduce((n,c)=>n+descendants(c),0)}async function fetchComments(){allComments=await api('comments?post_slug=eq.'+encodeURIComponent(slug)+'&approved=eq.true&select=id,parent_id,image_ref,author_name,body,is_author,created_at&order=created_at.asc')||[]}function render(){let rs=rootsFor(null),n=count(rs),title=document.getElementById('comments-title'),box=document.getElementById('comment-list');if(title)title.textContent=(lang==='en'?'Discussion about the post':'Дискусија о објави')+(n?' ('+n+')':'');if(box)box.innerHTML=rs.length?rs.map(c=>commentTree(c)).join(''):'<p class="comment-note">'+(lang==='en'?'No comments yet.':'Још нема коментара.')+'</p>';imgs.forEach((img,i)=>{const b=document.getElementById('pc'+i),s=document.getElementById('pcs'+i);if(!b||!s)return;const r=rootsFor(img),x=count(r);s.textContent=(lang==='en'?'Comments on this photo':'Коментари на ову слику')+(x?' ('+x+')':'');b.innerHTML=r.map(c=>commentTree(c)).join('')})}async function load(){try{await fetchComments();render()}catch(e){console.error(e)}}document.addEventListener('click',e=>{const b=e.target.closest('[data-reply]');if(!b)return;const f=document.getElementById('reply-'+b.dataset.reply);f.style.display=f.style.display==='grid'?'none':'grid'});async function submitPublic(form,payload){const btn=form.querySelector('button'),st=form.querySelector('.comment-status');btn.disabled=true;st.textContent=lang==='en'?'Sending…':'Шаљем…';try{await api('comments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});form.querySelectorAll('input,textarea').forEach(x=>x.value='');st.textContent=lang==='en'?'Thank you. Awaiting approval.':'Хвала. Коментар чека одобрење.'}catch(e){st.textContent=lang==='en'?'Could not send.':'Коментар није могао да буде послат.'}finally{btn.disabled=false}}
document.addEventListener('submit',e=>{const f=e.target;if(f.matches('.comment-form')){e.preventDefault();submitPublic(f,{post_slug:slug,author_name:f.querySelector('input').value.trim(),body:f.querySelector('textarea').value.trim()})}else if(f.matches('.photo-comment-form')){e.preventDefault();submitPublic(f,{post_slug:slug,image_ref:f.dataset.img,author_name:f.querySelector('input').value.trim(),body:f.querySelector('textarea').value.trim()})}else if(f.matches('.public-reply-form')){e.preventDefault();submitPublic(f,{post_slug:slug,image_ref:f.dataset.img||null,parent_id:Number(f.dataset.parent),author_name:f.querySelector('input').value.trim(),body:f.querySelector('textarea').value.trim()})}});function postDiscussionHtml(){return '<section class="comments"><h2 id="comments-title">Дискусија о објави</h2><div class="comment-list" id="comment-list"></div><form class="comment-form"><input maxlength="80" required placeholder="'+(lang==='en'?'Your name':'Ваше име')+'"><textarea maxlength="3000" required placeholder="'+(lang==='en'?'Leave a comment about the post':'Оставите коментар на објаву')+'"></textarea><button>'+(lang==='en'?'Send comment':'Пошаљи коментар')+'</button><div class="comment-note">'+(lang==='en'?'The comment will appear after approval by the site author.':'Коментар ће бити видљив након одобрења аутора сајта.')+'</div><div class="comment-status"></div></form></section>'}function photoCommentsHtml(src,i){return '<details class="photo-comments"><summary id="pcs'+i+'">'+(lang==='en'?'Comments on this photo':'Коментари на ову слику')+'</summary><div class="photo-comment-list" id="pc'+i+'"></div><form class="photo-comment-form" data-img="'+esc(src)+'"><input maxlength="80" required placeholder="'+(lang==='en'?'Your name':'Ваше име')+'"><textarea maxlength="3000" required placeholder="'+(lang==='en'?'Leave a comment':'Оставите коментар')+'"></textarea><button>'+(lang==='en'?'Send':'Пошаљи')+'</button><div class="comment-status"></div></form></details>'}function photoHtml(src,i,title){return '<div class="post-photo"><img class="zoomable" src="'+esc(src)+'" loading="lazy" alt="'+esc(title||'')+'">'+photoCommentsHtml(src,i)+'</div>'}fetch('/content/posts/index.json',{cache:'no-store'}).then(r=>r.json()).then(ps=>{const p=ps.find(x=>x.slug===slug);if(!p)throw 0;const en=lang==='en',title=en?(p.title_en||p.title):p.title,cat=en?(p.category_en||p.category):p.category,body=en?(p.body_en||p.summary_en||p.summary):(p.body||p.summary);imgs=[p.image,...(p.gallery||[])].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);document.title=title+' — Gypsy 28 Build';document.getElementById('post').innerHTML='<span>'+esc(cat||'')+'</span><h1>'+esc(title)+'</h1><div class="post-body">'+esc(body||'')+'</div>'+postDiscussionHtml()+(imgs.length?'<div class="gallery">'+imgs.map((x,i)=>photoHtml(x,i,title)).join('')+'</div>':'');bind();load()}).catch(()=>document.getElementById('post').textContent=lang==='en'?'Post not found.':'Објава није пронађена.');</script></body></html>
